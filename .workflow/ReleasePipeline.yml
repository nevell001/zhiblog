# ZhiBlog 发布流水线：打 v* 开头的 tag 时触发（如 v1.3.7）
# 构建测试 + 上传制品 + 发布 Gitee 发行版；部署阶段为骨架，配置好主机组后取消注释即可
version: '1.0'
name: release-pipeline
displayName: 版本发布（tag 触发）
triggers:
  trigger: auto
  push:
    tags:
      include:
        - v*
      # 排除 release@gitee 插件自动创建的 v1.3.6 tag，避免流水线被自身触发死循环
      exclude:
        - v1.3.6.*
stages:
  - name: backend
    displayName: 后端编译与测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@maven
        name: backend_maven
        displayName: Maven 编译与测试
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          # Gitee Go 镜像缺 libfreetype.so.6，水印测试需要；yum 不可用时忽略
          - yum install -y freetype || true
          - mvn -B clean verify
        artifacts:
          - name: BACKEND_JAR
            path:
              - zhi-admin/target/zhi-admin.jar
      - step: publish@general_artifacts
        name: publish_backend
        displayName: 上传后端制品
        dependArtifact: BACKEND_JAR
        artifactName: zhiblog-backend
        dependsOn: backend_maven
  - name: frontend
    displayName: 前端检查与构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: frontend_node
        displayName: Node 检查与构建
        nodeVersion: '22'
        commands:
          # Gitee Go Node 插件可能不提供 npm（nodeVersion 不受支持时），自带 Node 22.14.0 兜底
          - wget -qO- https://cdn.npmmirror.com/binaries/node/v22.14.0/node-v22.14.0-linux-x64.tar.gz | tar -xz -C /opt || true
          - export PATH=/opt/node-v22.14.0-linux-x64/bin:$PATH
          - node -v && npm -v
          - cd zhi-ui && npm config set registry https://registry.npmmirror.com && npm ci && npm run lint:check && npm run format:check && npm run test && npm run build:prod
        artifacts:
          - name: FRONTEND_DIST
            path:
              - zhi-ui/dist
      - step: publish@general_artifacts
        name: publish_frontend
        displayName: 上传前端制品
        dependArtifact: FRONTEND_DIST
        artifactName: zhiblog-frontend
        dependsOn: frontend_node
  - name: publish
    displayName: 发布 Gitee 发行版
    strategy: naturally
    trigger: auto
    steps:
      # Gitee Go Release 插件：自动创建仓库「发行版」，复用触发流水线的 v1.3.6 tag
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: ZhiBlog v1.3.6
        description: ZhiBlog v1.3.6 发布构建（Gitee Go 流水线自动生成）。
        tagName: v1.3.6
        upstreamArtifact:
          - BACKEND_JAR
        assertFiles:
          - zhi-admin/target/zhi-admin.jar
        prerelease: false
        allowUpdate: true
  # ------------------------------------------------------------------
  # 部署骨架：开通后请在 Gitee Go 控制台创建主机组并安装 Agent，
  # 将下方 hostGroupID 替换为真实值，并取消整段注释。
  # 服务器密钥、R_TOKEN_SECRET、DB_PASSWORD、REDIS_PASSWORD、DRUID_PASSWORD
  # 等敏感信息请配置在流水线参数/凭据中，不要提交到仓库。
