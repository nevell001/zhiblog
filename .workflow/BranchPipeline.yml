# ZhiBlog 分支流水线：push 到非 main 分支时触发，执行全量测试构建
version: '1.0'
name: branch-pipeline
displayName: 分支测试与构建
triggers:
  trigger: auto
  push:
    branches:
      include:
        - .*
      exclude:
        - main
stages:
  - name: backend
    displayName: 后端编译与测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@maven
        name: backend_maven
        displayName: Maven 编译与测试
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          # Gitee Go 镜像缺 libfreetype.so.6，水印测试需要；yum 不可用时忽略
          - yum install -y freetype || true
          - mvn -B clean verify
  - name: frontend
    displayName: 前端检查与构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: frontend_node
        displayName: Node 检查与构建
        nodeVersion: 22
        commands:
          - cd zhi-ui && npm ci && npm run lint:check && npm run format:check && npm run test && npm run build:prod
