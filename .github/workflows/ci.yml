# ZhiBlog CI：push 到任意分支或向 main 发起 PR 时触发，与 Gitee Go 流水线逻辑一致
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # mvn verify = 编译 + 单测 + checkstyle + JaCoCo 覆盖率门槛
      - name: Maven 编译与测试
        run: mvn -B clean verify
      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zhi-admin/target/zhi-admin.jar
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zhi-ui/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:prod
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zhi-ui/dist
          retention-days: 7
          if-no-files-found: error
