# ZhiBlog 发布流水线：打 v* 开头的 tag 时触发（如 v1.3.7），构建测试 + 部署骨架
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven 编译与测试
        run: mvn -B clean verify
      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zhi-admin/target/zhi-admin.jar
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zhi-ui/package-lock.json
      - name: 前端依赖安装
        run: npm ci
        working-directory: zhi-ui
      - name: 前端检查与测试
        run: npm run lint:check && npm run format:check && npm run test && npm run build:prod
        working-directory: zhi-ui
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zhi-ui/dist
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 部署骨架：在 GitHub 仓库 Settings -> Secrets and variables 配置
  # SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY 后，取消下方注释即可。
  # 敏感信息请全部走 Secrets，不要写进本文件。
