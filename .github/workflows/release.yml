# ZhiBlog 发布流水线：打 v* 开头的 tag 时触发（如 v1.3.7），构建测试 + 自动创建 GitHub Release + 部署骨架
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 校验 tag 与 pom 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          echo "tag=${TAG_VERSION} pom=${POM_VERSION}"
          [ "${TAG_VERSION}" = "${POM_VERSION}" ] || { echo "::error::tag ${GITHUB_REF_NAME} 与 pom 版本 ${POM_VERSION} 不一致"; exit 1; }
      - name: Maven 编译与测试
        run: mvn -B clean verify
      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zhi-admin/target/zhi-admin.jar
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zhi-ui/package-lock.json
      - name: 前端依赖安装
        run: npm ci
        working-directory: zhi-ui
      - name: 前端检查与测试
        run: npm run lint:check && npm run format:check && npm run typecheck && npm run test:coverage && npm run build:prod
        working-directory: zhi-ui
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zhi-ui/dist
          if-no-files-found: error
      - name: 准备部署配套
        run: |
          mkdir -p deploy-assets
          cp sql/00_init_database.sql deploy-assets/
          cp zhi-ui/nginx.conf deploy-assets/
          cp .env.example deploy-assets/
          cp docs/DEPLOYMENT_RELEASE.md deploy-assets/
          cd deploy-assets && zip -qr ../deploy-assets.zip .
      - name: 上传部署配套
        uses: actions/upload-artifact@v4
        with:
          name: deploy-assets
          path: deploy-assets.zip
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - uses: actions/download-artifact@v4
        with:
          name: deploy-assets
          path: release/deploy-assets
      - name: 打包前端产物
        run: cd release/frontend && zip -qr ../frontend-dist.zip .
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同 tag 已存在 Release 时先删除，保证重复发布可覆盖
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            release/backend/zhi-admin.jar \
            release/frontend-dist.zip \
            release/deploy-assets/deploy-assets.zip \
            --title "ZhiBlog ${GITHUB_REF_NAME}" \
            --notes "ZhiBlog ${GITHUB_REF_NAME} 自动发布构建（GitHub Actions 生成）。包含：后端 jar、前端 dist、部署配套（sql / nginx / .env 示例），部署步骤见 docs/DEPLOYMENT_RELEASE.md。"

  # ------------------------------------------------------------------
  # 部署骨架：在 GitHub 仓库 Settings -> Secrets and variables 配置
  # SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY 后，取消下方注释即可。
  # 敏感信息请全部走 Secrets，不要写进本文件。
